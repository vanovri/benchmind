[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmind"
version = "0.2.0"
description = "Autonomous Multimodal Hardware & Signal Diagnostics Agent (Meta Global AI Developer Hackathon)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ardhya Novri Ramadhan", email = "ardhyasan@gmail.com" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
