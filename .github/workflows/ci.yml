name: BenchMind CI & Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest & coverage
        run: python -m pip install pytest pytest-cov
      - name: Run unit & DSP verification suite with coverage
        run: python -m pytest -v --cov=benchmind --cov-report=xml
      - name: Generate deterministic verification artifact
        run: python -m benchmind.cli --output evidence/benchmind-verification.json
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage.xml
